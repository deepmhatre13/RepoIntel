# RepoIntel production nginx configuration.
#
# Serves the built React frontend and forwards /api/* to the Python API
# container on port 8000 (same network, service name "api").

server {
    listen 80;
    server_name _;

    # Built React SPA
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall through to index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy: nginx -> uvicorn :8000
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Long-running job submissions may take >30s; do not impose tighter limits.
    client_max_body_size 50m;

    # Cache static assets aggressively (fingerprinted by Vite).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}