[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repointel"
version = "0.1.0"
description = "Agentic repository-intelligence platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "langfuse>=3.0.0",
    "ollama>=0.1.0",
    "sentence-transformers>=2.7.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.6.0",
    "rich>=13.7.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-go>=0.20.0",
    "tree-sitter-rust>=0.20.0",
    "tree-sitter-c>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pathspec>=0.12.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
include = [
    "repointel*",
    "packages*",
    "apps*",
    "evals*"
]

exclude = [
    "tests*",
    "output*",
    "evals.datasets*",
    "evals.reports*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

markers = [
    "integration: tests that exercise real external components (e.g. the local embedding model); slower, still run by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false